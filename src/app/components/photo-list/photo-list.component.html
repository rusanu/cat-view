  <div class="photo-grid">
    <!-- Live Photo Card - always first -->
     <!-- 
    <div class="photo-item"
         [class.selected]="isLiveActive"
         (click)="onLiveCardClick()">
      <img *ngIf="livePhotoUrl"

           [style.transform]="getRotationStyle()"

      <div class="photo-time-overlay">

        <span *ngIf="isLiveConnecting" class="spinner-border spinner-border-sm text-light" role="status"></span>
      </div>
    </div>
  -->

    <!-- Regular photo items -->
    <div class="photo-item"
         *ngFor="let photo of photos; trackBy: trackByKey"
         [class.selected]="isSelected(photo)"
         (click)="onPhotoClick(photo)">
      <img [src]="photo.url"
           [alt]="photo.fileName"
           class="thumbnail"
           loading="lazy"
           (load)="onImageLoad($event)"
           (error)="onImageError($event)"
           [style.transform]="getRotationStyle()"
           [style.filter]="getBrightnessFilter(config.brightnessLevel$ | async)">
      <div class="photo-time-overlay">
        {{ formatTime(photo.timestamp) }}
      </div>
      <div class="photo-favourite-overlay"
           [class.is-favourite]="isFavourite(photo)"
           [class.is-favouring]="isFavouring(photo)"
           (click)="onFavouriteClick($event, photo)"
           title="Favourite">
        <span *ngIf="!isFavouring(photo)">{{ isFavourite(photo) ? '♥' : '♡' }}</span>
        <span *ngIf="isFavouring(photo)" class="spinner-border spinner-border-sm text-light" role="status"></span>
      </div>
    </div>
  </div>
  <div class="load-more-spinner" *ngIf="isLoadingMore">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</div>
